# 📝 MIS NOTAS (Encuentro 4 · 23 nov 2026)
# 🎯 Configuración de pytest. Se lee sola al correr python -m pytest desde esta carpeta.
#    - pythonpath = src → agrega src/ a la búsqueda de import. Por eso en tests/ funciona
#                         "from producto import Producto" aunque producto.py esté en src/.
#    - testpaths = tests → pytest busca pruebas en tests/ (archivos test_*.py).
# ⚠️ Segunda causa frecuente de "pasa en mi computador y falla en CI": sin este archivo
#    sale "ModuleNotFoundError: No module named 'producto'" (2 errors during collection).
# 💡 En .ini los comentarios van en líneas propias que empiezan con # o ;.
[pytest]
pythonpath = src
testpaths = tests
