# Cópialo a .github/workflows/ci.yml en tu repositorio y ajusta lo marcado con <--.
name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # <-- la misma versión con la que pruebas en tu computador

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt   # <-- tu archivo de dependencias

      - name: Ejecutar pruebas
        run: python -m pytest -v   # <-- el mismo comando que escribes en tu README
