# 📝 MIS NOTAS (Encuentro 4 · 23 nov 2026)
# 🎯 Igual que en ci_inventario/: código en src/, pruebas en tests/.
# ⚠️ Ojo: testpaths = tests dice DÓNDE buscar, pero no cambia el nombre que buscar.
#    Por defecto pytest solo recoge archivos test_*.py (o *_test.py). prueba_producto.py no cumple.
#    (Se podría cambiar con python_files = prueba_*.py, pero lo normal es renombrar el archivo.)
[pytest]
pythonpath = src
testpaths = tests
